<svg viewBox="0 0 720 430" role="img" xmlns="http://www.w3.org/2000/svg"><title>How the Module 2 concepts connect</title><desc>Three groups. Who does the work: the Single Responsibility Principle gives each class one responsibility, and other objects reach it through delegation; separation of concerns splits a program into a model and a user interface. Same or not: value and entity decide the rule of equality, equality must agree with the hash code, and identity implies equality. A fixed set of values: an enumeration gives type safety and lists every enum constant, which a switch expression must cover.</desc><g class="kc-col" data-kc="responsibility"><text x="20" y="22" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="var(--c-muted)">Who does the work</text><text x="220" y="22" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-muted)">weeks 5-6</text></g><g class="kc-col" data-kc="equality"><text x="260" y="22" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="var(--c-muted)">Same or not</text><text x="460" y="22" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-muted)">week 5</text></g><g class="kc-col" data-kc="enum"><text x="500" y="22" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="var(--c-muted)">A fixed set of values</text><text x="700" y="22" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-muted)">week 6</text></g><g class="kc-edge" data-kc="srp responsibility"><path d="M120,88 L120,122" fill="none" stroke="var(--c-muted)" stroke-width="1.5" opacity="0.7"/><polyline points="115.0,113.0 120,122 125.0,113.0" fill="none" stroke="var(--c-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/><text x="128" y="110" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-accent)">one per class</text></g><g class="kc-edge" data-kc="responsibility delegation"><path d="M120,168 L120,202" fill="none" stroke="var(--c-muted)" stroke-width="1.5" opacity="0.7"/><polyline points="115.0,193.0 120,202 125.0,193.0" fill="none" stroke="var(--c-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/><text x="128" y="190" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-accent)">others ask the owner</text></g><g class="kc-edge" data-kc="separation model-ui"><path d="M120,338 L120,372" fill="none" stroke="var(--c-muted)" stroke-width="1.5" opacity="0.7"/><polyline points="115.0,363.0 120,372 125.0,363.0" fill="none" stroke="var(--c-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/><text x="128" y="360" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-accent)">splits a program into</text></g><g class="kc-node" data-kc="srp"><a href="#kc-srp"><title>Single Responsibility: one reason to change</title><rect x="20" y="44" width="200" height="44" rx="8" fill="var(--c-raised)" stroke="var(--c-accent)" stroke-width="2"/><text x="32" y="63" font-family="Source Serif 4, Georgia, serif" font-size="14" font-weight="700" fill="var(--c-ink)">Single Responsibility</text><text x="32" y="79" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-muted)">one reason to change</text></a></g><g class="kc-node" data-kc="responsibility"><a href="#kc-responsibility"><title>Responsibility: a job a class owns</title><rect x="20" y="124" width="200" height="44" rx="8" fill="var(--c-surface)" stroke="var(--c-border)" stroke-width="2"/><text x="32" y="143" font-family="Source Serif 4, Georgia, serif" font-size="14" font-weight="700" fill="var(--c-ink)">Responsibility</text><text x="32" y="159" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-muted)">a job a class owns</text></a></g><g class="kc-node" data-kc="delegation"><a href="#kc-delegation"><title>Delegation: ask, do not reach in</title><rect x="20" y="204" width="200" height="44" rx="8" fill="var(--c-surface)" stroke="var(--c-border)" stroke-width="2"/><text x="32" y="223" font-family="Source Serif 4, Georgia, serif" font-size="14" font-weight="700" fill="var(--c-ink)">Delegation</text><text x="32" y="239" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-muted)">ask, do not reach in</text></a></g><g class="kc-node" data-kc="separation"><a href="#kc-separation"><title>Separation of concerns: rules apart from talk</title><rect x="20" y="294" width="200" height="44" rx="8" fill="var(--c-surface)" stroke="var(--c-border)" stroke-width="2"/><text x="32" y="313" font-family="Source Serif 4, Georgia, serif" font-size="14" font-weight="700" fill="var(--c-ink)">Separation of concerns</text><text x="32" y="329" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-muted)">rules apart from talk</text></a></g><g class="kc-node" data-kc="model-ui"><a href="#kc-model-ui"><title>Model and user interface: decides / talks</title><rect x="20" y="374" width="200" height="44" rx="8" fill="var(--c-surface)" stroke="var(--c-border)" stroke-width="2"/><text x="32" y="393" font-family="Source Serif 4, Georgia, serif" font-size="14" font-weight="700" fill="var(--c-ink)">Model and user interface</text><text x="32" y="409" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-muted)">decides / talks</text></a></g><g class="kc-edge" data-kc="value-entity equality"><path d="M360,88 L360,122" fill="none" stroke="var(--c-muted)" stroke-width="1.5" opacity="0.7"/><polyline points="355.0,113.0 360,122 365.0,113.0" fill="none" stroke="var(--c-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/><text x="368" y="110" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-accent)">decides the rule of</text></g><g class="kc-edge" data-kc="equality hashcode"><path d="M360,168 L360,202" fill="none" stroke="var(--c-muted)" stroke-width="1.5" opacity="0.7"/><polyline points="355.0,193.0 360,202 365.0,193.0" fill="none" stroke="var(--c-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/><text x="368" y="190" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-accent)">must agree with</text></g><g class="kc-edge" data-kc="identity equality"><path d="M460,316 L474,316 L474,146 L462,146" fill="none" stroke="var(--c-muted)" stroke-width="1.5" opacity="0.7"/><polyline points="471.0,141.0 462,146 471.0,151.0" fill="none" stroke="var(--c-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/><text x="470" y="274" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-accent)">implies</text></g><g class="kc-node" data-kc="value-entity"><a href="#kc-value-entity"><title>Value and entity: which fields decide</title><rect x="260" y="44" width="200" height="44" rx="8" fill="var(--c-surface)" stroke="var(--c-border)" stroke-width="2"/><text x="272" y="63" font-family="Source Serif 4, Georgia, serif" font-size="14" font-weight="700" fill="var(--c-ink)">Value and entity</text><text x="272" y="79" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-muted)">which fields decide</text></a></g><g class="kc-node" data-kc="equality"><a href="#kc-equality"><title>Equality: equals(): same thing</title><rect x="260" y="124" width="200" height="44" rx="8" fill="var(--c-raised)" stroke="var(--c-accent)" stroke-width="2"/><text x="272" y="143" font-family="Source Serif 4, Georgia, serif" font-size="14" font-weight="700" fill="var(--c-ink)">Equality</text><text x="272" y="159" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-muted)">equals(): same thing</text></a></g><g class="kc-node" data-kc="hashcode"><a href="#kc-hashcode"><title>Hash code: hashCode(), the bucket</title><rect x="260" y="204" width="200" height="44" rx="8" fill="var(--c-surface)" stroke="var(--c-border)" stroke-width="2"/><text x="272" y="223" font-family="Source Serif 4, Georgia, serif" font-size="14" font-weight="700" fill="var(--c-ink)">Hash code</text><text x="272" y="239" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-muted)">hashCode(), the bucket</text></a></g><g class="kc-node" data-kc="identity"><a href="#kc-identity"><title>Identity: ==: same object</title><rect x="260" y="294" width="200" height="44" rx="8" fill="var(--c-surface)" stroke="var(--c-border)" stroke-width="2"/><text x="272" y="313" font-family="Source Serif 4, Georgia, serif" font-size="14" font-weight="700" fill="var(--c-ink)">Identity</text><text x="272" y="329" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-muted)">==: same object</text></a></g><g class="kc-edge" data-kc="enum type-safety"><path d="M600,124 L600,90" fill="none" stroke="var(--c-muted)" stroke-width="1.5" opacity="0.7"/><polyline points="605.0,99.0 600,90 595.0,99.0" fill="none" stroke="var(--c-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/><text x="608" y="110" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-accent)">gives</text></g><g class="kc-edge" data-kc="enum enum-constant"><path d="M600,168 L600,202" fill="none" stroke="var(--c-muted)" stroke-width="1.5" opacity="0.7"/><polyline points="595.0,193.0 600,202 605.0,193.0" fill="none" stroke="var(--c-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/><text x="608" y="190" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-accent)">lists every</text></g><g class="kc-edge" data-kc="enum-constant switch-expression"><path d="M600,248 L600,282" fill="none" stroke="var(--c-muted)" stroke-width="1.5" opacity="0.7"/><polyline points="595.0,273.0 600,282 605.0,273.0" fill="none" stroke="var(--c-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/><text x="608" y="270" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-accent)">all covered by</text></g><g class="kc-node" data-kc="type-safety"><a href="#kc-type-safety"><title>Type safety: typos do not compile</title><rect x="500" y="44" width="200" height="44" rx="8" fill="var(--c-surface)" stroke="var(--c-border)" stroke-width="2"/><text x="512" y="63" font-family="Source Serif 4, Georgia, serif" font-size="14" font-weight="700" fill="var(--c-ink)">Type safety</text><text x="512" y="79" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-muted)">typos do not compile</text></a></g><g class="kc-node" data-kc="enum"><a href="#kc-enum"><title>Enumeration: enum: a fixed list</title><rect x="500" y="124" width="200" height="44" rx="8" fill="var(--c-raised)" stroke="var(--c-accent)" stroke-width="2"/><text x="512" y="143" font-family="Source Serif 4, Georgia, serif" font-size="14" font-weight="700" fill="var(--c-ink)">Enumeration</text><text x="512" y="159" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-muted)">enum: a fixed list</text></a></g><g class="kc-node" data-kc="enum-constant"><a href="#kc-enum-constant"><title>Enum constant: an object, made once</title><rect x="500" y="204" width="200" height="44" rx="8" fill="var(--c-surface)" stroke="var(--c-border)" stroke-width="2"/><text x="512" y="223" font-family="Source Serif 4, Georgia, serif" font-size="14" font-weight="700" fill="var(--c-ink)">Enum constant</text><text x="512" y="239" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-muted)">an object, made once</text></a></g><g class="kc-node" data-kc="switch-expression"><a href="#kc-switch-expression"><title>Switch expression: covers every case</title><rect x="500" y="284" width="200" height="44" rx="8" fill="var(--c-surface)" stroke="var(--c-border)" stroke-width="2"/><text x="512" y="303" font-family="Source Serif 4, Georgia, serif" font-size="14" font-weight="700" fill="var(--c-ink)">Switch expression</text><text x="512" y="319" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-muted)">covers every case</text></a></g></svg>