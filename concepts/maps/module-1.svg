<svg viewBox="0 0 720 400" role="img" xmlns="http://www.w3.org/2000/svg"><title>How the Module 1 concepts connect</title><desc>A class describes objects and owns its static members. A constructor builds an object. A reference points at an object or may be null, and a list holds many references, visited by a for-each loop. An object knows things through its fields and does things through its methods. Private fields and checking methods make up encapsulation, which protects the invariant. final fixes a field once.</desc><g class="kc-edge" data-kc="class object"><path d="M322,64 L322,128" fill="none" stroke="var(--c-muted)" stroke-width="1.5" opacity="0.7"/><polyline points="317.0,119.0 322,128 327.0,119.0" fill="none" stroke="var(--c-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/><text x="330" y="101" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-accent)">describes</text></g><g class="kc-edge" data-kc="constructor object"><path d="M144,152 L258,152" fill="none" stroke="var(--c-muted)" stroke-width="1.5" opacity="0.7"/><polyline points="249.0,157.0 258,152 249.0,147.0" fill="none" stroke="var(--c-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/><text x="201" y="145" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-accent)">builds</text></g><g class="kc-edge" data-kc="class static"><path d="M384,42 L498,42" fill="none" stroke="var(--c-muted)" stroke-width="1.5" opacity="0.7"/><polyline points="489.0,47.0 498,42 489.0,37.0" fill="none" stroke="var(--c-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/><text x="441" y="35" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-accent)">owns</text></g><g class="kc-edge" data-kc="reference object"><path d="M500,152 L386,152" fill="none" stroke="var(--c-muted)" stroke-width="1.5" opacity="0.7"/><polyline points="395.0,147.0 386,152 395.0,157.0" fill="none" stroke="var(--c-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/><text x="443" y="145" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-accent)">points at</text></g><g class="kc-edge" data-kc="object field"><path d="M300,174 L225,238" fill="none" stroke="var(--c-muted)" stroke-width="1.5" opacity="0.7"/><polyline points="228.6,228.4 225,238 235.1,236.0" fill="none" stroke="var(--c-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/><text x="256" y="210" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-accent)">knows</text></g><g class="kc-edge" data-kc="object method"><path d="M344,174 L359,238" fill="none" stroke="var(--c-muted)" stroke-width="1.5" opacity="0.7"/><polyline points="352.1,230.4 359,238 361.8,228.1" fill="none" stroke="var(--c-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/><text x="360" y="210" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-accent)">does</text></g><g class="kc-edge" data-kc="reference null"><path d="M600,174 L650,238" fill="none" stroke="var(--c-muted)" stroke-width="1.5" opacity="0.7"/><polyline points="640.5,234.0 650,238 648.4,227.8" fill="none" stroke="var(--c-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/><text x="632" y="204" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-accent)">may be</text></g><g class="kc-edge" data-kc="list reference"><path d="M532,240 L548,176" fill="none" stroke="var(--c-muted)" stroke-width="1.5" opacity="0.7"/><polyline points="550.7,185.9 548,176 541.0,183.5" fill="none" stroke="var(--c-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/><text x="534" y="212" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-accent)">holds</text></g><g class="kc-edge" data-kc="foreach list"><path d="M636,340 L565,286" fill="none" stroke="var(--c-muted)" stroke-width="1.5" opacity="0.7"/><polyline points="575.2,287.5 565,286 569.1,295.4" fill="none" stroke="var(--c-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/><text x="610" y="318" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-accent)">visits</text></g><g class="kc-edge" data-kc="field encapsulation"><path d="M212,284 L262,338" fill="none" stroke="var(--c-muted)" stroke-width="1.5" opacity="0.7"/><polyline points="252.2,334.8 262,338 259.6,328.0" fill="none" stroke="var(--c-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/><text x="232" y="318" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-accent)">private</text></g><g class="kc-edge" data-kc="method encapsulation"><path d="M362,284 L330,338" fill="none" stroke="var(--c-muted)" stroke-width="1.5" opacity="0.7"/><polyline points="330.3,327.7 330,338 338.9,332.8" fill="none" stroke="var(--c-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/><text x="352" y="318" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-accent)">checks</text></g><g class="kc-edge" data-kc="encapsulation invariant"><path d="M365,362 L428,362" fill="none" stroke="var(--c-muted)" stroke-width="1.5" opacity="0.7"/><polyline points="419.0,367.0 428,362 419.0,357.0" fill="none" stroke="var(--c-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/><text x="397" y="355" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-accent)">protects</text></g><g class="kc-edge" data-kc="final field"><path d="M100,340 L176,286" fill="none" stroke="var(--c-muted)" stroke-width="1.5" opacity="0.7"/><polyline points="171.6,295.3 176,286 165.8,287.1" fill="none" stroke="var(--c-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/><text x="132" y="318" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-accent)">fixes</text></g><g class="kc-node" data-kc="class"><a href="#kc-class"><title>Class: the description</title><rect x="260" y="20" width="124" height="44" rx="8" fill="var(--c-surface)" stroke="var(--c-border)" stroke-width="2"/><text x="272" y="39" font-family="Source Serif 4, Georgia, serif" font-size="14" font-weight="700" fill="var(--c-ink)">Class</text><text x="272" y="55" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-muted)">the description</text></a></g><g class="kc-node" data-kc="static"><a href="#kc-static"><title>static: one per class</title><rect x="500" y="20" width="124" height="44" rx="8" fill="var(--c-surface)" stroke="var(--c-border)" stroke-width="2"/><text x="512" y="39" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="var(--c-ink)">static</text><text x="512" y="55" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-muted)">one per class</text></a></g><g class="kc-node" data-kc="constructor"><a href="#kc-constructor"><title>Constructor: runs once, at new</title><rect x="20" y="130" width="124" height="44" rx="8" fill="var(--c-surface)" stroke="var(--c-border)" stroke-width="2"/><text x="32" y="149" font-family="Source Serif 4, Georgia, serif" font-size="14" font-weight="700" fill="var(--c-ink)">Constructor</text><text x="32" y="165" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-muted)">runs once, at new</text></a></g><g class="kc-node" data-kc="object"><a href="#kc-object"><title>Object: state + behaviour</title><rect x="260" y="130" width="124" height="44" rx="8" fill="var(--c-raised)" stroke="var(--c-accent)" stroke-width="2"/><text x="272" y="149" font-family="Source Serif 4, Georgia, serif" font-size="14" font-weight="700" fill="var(--c-ink)">Object</text><text x="272" y="165" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-muted)">state + behaviour</text></a></g><g class="kc-node" data-kc="reference"><a href="#kc-reference"><title>Reference: an arrow to it</title><rect x="500" y="130" width="124" height="44" rx="8" fill="var(--c-surface)" stroke="var(--c-border)" stroke-width="2"/><text x="512" y="149" font-family="Source Serif 4, Georgia, serif" font-size="14" font-weight="700" fill="var(--c-ink)">Reference</text><text x="512" y="165" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-muted)">an arrow to it</text></a></g><g class="kc-node" data-kc="field"><a href="#kc-field"><title>Field: what it knows</title><rect x="150" y="240" width="124" height="44" rx="8" fill="var(--c-surface)" stroke="var(--c-border)" stroke-width="2"/><text x="162" y="259" font-family="Source Serif 4, Georgia, serif" font-size="14" font-weight="700" fill="var(--c-ink)">Field</text><text x="162" y="275" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-muted)">what it knows</text></a></g><g class="kc-node" data-kc="method"><a href="#kc-method"><title>Method: what it does</title><rect x="300" y="240" width="124" height="44" rx="8" fill="var(--c-surface)" stroke="var(--c-border)" stroke-width="2"/><text x="312" y="259" font-family="Source Serif 4, Georgia, serif" font-size="14" font-weight="700" fill="var(--c-ink)">Method</text><text x="312" y="275" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-muted)">what it does</text></a></g><g class="kc-node" data-kc="list"><a href="#kc-list"><title>List: many references</title><rect x="470" y="240" width="124" height="44" rx="8" fill="var(--c-surface)" stroke="var(--c-border)" stroke-width="2"/><text x="482" y="259" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="var(--c-ink)">List</text><text x="482" y="275" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-muted)">many references</text></a></g><g class="kc-node" data-kc="null"><a href="#kc-null"><title>null: no object</title><rect x="616" y="240" width="92" height="44" rx="8" fill="var(--c-surface)" stroke="var(--c-border)" stroke-width="2"/><text x="628" y="259" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="var(--c-ink)">null</text><text x="628" y="275" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-muted)">no object</text></a></g><g class="kc-node" data-kc="final"><a href="#kc-final"><title>final: set once</title><rect x="20" y="340" width="110" height="44" rx="8" fill="var(--c-surface)" stroke="var(--c-border)" stroke-width="2"/><text x="32" y="359" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="var(--c-ink)">final</text><text x="32" y="375" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-muted)">set once</text></a></g><g class="kc-node" data-kc="encapsulation"><a href="#kc-encapsulation"><title>Encapsulation: private + checks</title><rect x="225" y="340" width="140" height="44" rx="8" fill="var(--c-surface)" stroke="var(--c-border)" stroke-width="2"/><text x="237" y="359" font-family="Source Serif 4, Georgia, serif" font-size="14" font-weight="700" fill="var(--c-ink)">Encapsulation</text><text x="237" y="375" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-muted)">private + checks</text></a></g><g class="kc-node" data-kc="invariant"><a href="#kc-invariant"><title>Invariant: always true</title><rect x="430" y="340" width="124" height="44" rx="8" fill="var(--c-surface)" stroke="var(--c-border)" stroke-width="2"/><text x="442" y="359" font-family="Source Serif 4, Georgia, serif" font-size="14" font-weight="700" fill="var(--c-ink)">Invariant</text><text x="442" y="375" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-muted)">always true</text></a></g><g class="kc-node" data-kc="foreach"><a href="#kc-foreach"><title>for-each: visits each item</title><rect x="590" y="340" width="116" height="44" rx="8" fill="var(--c-surface)" stroke="var(--c-border)" stroke-width="2"/><text x="602" y="359" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="var(--c-ink)">for-each</text><text x="602" y="375" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-muted)">visits each item</text></a></g></svg>