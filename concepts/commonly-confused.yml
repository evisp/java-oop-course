# Commonly confused pairs. Grouped by module, in teaching order.
#
#   id          anchor (#vs-<id>)
#   title       heading of the pair
#   module      module-1, module-2, ...
#   lecture     the page that teaches it; hidden until that page is released
#   source      label for the link
#   figure      optional SVG in concepts/figures/
#   a, b        the two sides: term, text, code
#   difference  one or two sentences
#   check       a question, and its answer

modules:
  module-1: Objects and State
  module-2: Designing with Objects

pairs:

  - id: reference-object
    title: Reference and object
    module: module-1
    lecture: 01-objects-and-state/references.md
    source: L2.2 What a variable really holds
    figure: reference-vs-object.svg
    a:
      term: Reference
      text: The arrow a variable holds. Copying it is cheap and creates nothing.
      code: |
        Account backup = ada;   // a new arrow
    b:
      term: Object
      text: The account itself, with its own fields. Only `new` creates one.
      code: |
        new Account("AC-1001", "Ada Lovelace", 500.00)
    difference: >-
      Two variables can hold arrows to the same object. A change made through
      either name is a change to that one object.
    check:
      question: >-
        `Account a = new Account("AC-1001", "Ada Lovelace", 100.00);` then
        `Account b = a;` and `b.deposit(50.00);`. What does `a.getBalance()`
        return, and how many accounts exist?
      answer: >-
        `150.0`, and there is one account. `b = a` copied the arrow, not the
        account.

  - id: static-instance
    title: "`static` and instance"
    module: module-1
    lecture: 01-objects-and-state/what-belongs-to-whom.md
    source: L3.2 What belongs to whom
    figure: static-vs-instance.svg
    a:
      term: Instance field
      text: Belongs to one object. Every account has its own balance.
      code: |
        private double balance;
        ada.getBalance();
    b:
      term: "`static` field"
      text: Belongs to the class. One copy, shared by every account.
      code: |
        private static int lastNumberIssued;
        Account.getAccountsOpened();
    difference: >-
      Ask whether every object needs its own value. If yes, it is an instance
      field. If it is one fact about all of them together, it is `static`. A
      `static` method has no `this`, so it cannot use instance fields
      directly.
    check:
      question: >-
        `lastNumberIssued` starts at 1000 and every constructor runs
        `lastNumberIssued++`. After three accounts are created, how many copies
        of the field exist, and what do they hold?
      answer: >-
        One copy, holding 1003. Each account has its own `balance`, but they
        all share `lastNumberIssued`.

  - id: class-object
    title: Class and object
    module: module-1
    lecture: 01-objects-and-state/first-class.md
    source: L2.1 Your first class
    a:
      term: Class
      text: The description, written once in a `.java` file.
      code: |
        public class Account { ... }
    b:
      term: Object
      text: One thing made from that description while the program runs.
      code: |
        new Account("AC-1001", "Ada Lovelace", 500.00)
    difference: >-
      A class is like a blank form, and objects are the filled-in copies: one
      form, many copies, each with its own answers.
    check:
      question: >-
        A program declares `class Account` and calls `new Account(...)` three
        times. How many classes and how many objects are there?
      answer: One class and three objects.

  - id: equals
    title: "`==` and `equals`"
    module: module-1
    lecture: 01-objects-and-state/references.md
    source: L2.2 What a variable really holds
    a:
      term: "`==`"
      text: For objects, compares references. Are these the same object?
      code: |
        ada == alan   // false: two objects
    b:
      term: "`equals`"
      text: Compares by the rule the class defines. Do these count as the same thing?
      code: |
        a.equals(b)   // true for two equal Strings
    difference: >-
      Use `equals` for `String` and for your own classes. For primitives such
      as `int` and `double`, `==` compares the values themselves.
    check:
      question: >-
        `String a = new String("AC-1001");` and
        `String b = new String("AC-1001");`. What do `a == b` and
        `a.equals(b)` give?
      answer: >-
        `false`, then `true`. They are two objects holding the same text.

  - id: field-local
    title: Field and local variable
    module: module-1
    lecture: 01-objects-and-state/first-class.md
    source: L2.1 Your first class
    a:
      term: Field
      text: Declared in the class, outside every method. It belongs to the object.
      code: |
        private String ownerName;
    b:
      term: Local variable
      text: Declared inside a method. It exists only while the method runs.
      code: |
        double total = 0;   // inside getTotalBalance()
    difference: >-
      When a parameter has the same name as a field, the parameter wins inside
      the method. `this.ownerName` reaches the field.
    check:
      question: >-
        A constructor contains `ownerName = ownerName;`. It compiles. What does
        the field hold afterwards?
      answer: >-
        `null`. The line assigns the parameter to itself, so the field is never
        set. Write `this.ownerName = ownerName;`.

  - id: constructor-method
    title: Constructor and method
    module: module-1
    lecture: 01-objects-and-state/first-class.md
    source: L2.1 Your first class
    a:
      term: Constructor
      text: Runs once, through `new`. Same name as the class, no return type.
      code: |
        public Account(String accountNumber, ...)
    b:
      term: Method
      text: Runs each time it is called. Always has a return type, even if `void`.
      code: |
        public boolean deposit(double amount)
    difference: >-
      Adding a return type turns a constructor into a method:
      `public void Account(...)` is a method that happens to share the class's
      name.
    check:
      question: >-
        The class has only `public void Account(String n, String o, double b)`.
        Why does `new Account("AC-1001", "Ada Lovelace", 500.00)` not compile?
      answer: >-
        That declaration is a method, not a constructor. The class has no
        constructor that takes three arguments.

  - id: final-immutable
    title: "`final` and immutable"
    module: module-1
    lecture: 01-objects-and-state/what-belongs-to-whom.md
    source: L3.2 What belongs to whom
    a:
      term: "`final`"
      text: The field cannot be pointed at anything else once it has a value.
      code: |
        private final List<Account> accounts
                = new ArrayList<>();
    b:
      term: Immutable
      text: The object itself cannot change after it is built.
      code: |
        String name = "ada";   // no method changes it
    difference: >-
      `final` fixes the arrow; immutable fixes the object. A `final` list can
      still have accounts added to it.
    check:
      question: >-
        With `private final List<Account> accounts`, can `accounts.add(...)`
        run? Can `accounts = new ArrayList<>();` run?
      answer: >-
        The first, yes: the list itself can change. The second, no: the field
        is `final`, so it cannot be pointed at another list.

  - id: false-throw
    title: Returning `false` and throwing an exception
    module: module-1
    lecture: 01-objects-and-state/objects-that-refuse.md
    source: L3.1 Objects that refuse
    a:
      term: Return `false`
      text: An ordinary no, which the caller should expect and handle.
      code: |
        if (!account.withdraw(900.00)) { ... }
    b:
      term: Throw
      text: A request that should never have been made, which means a bug in the caller.
      code: |
        throw new IllegalArgumentException(
                "Deposit must be positive: " + amount);
    difference: >-
      Not having enough money is a normal answer, so `withdraw` returns
      `false`. A negative amount means the calling code is wrong, so the
      account throws.
    check:
      question: >-
        Which of these should refuse with an exception: withdrawing more than
        the balance, or creating an account with a `null` owner name?
      answer: >-
        The `null` owner name. Asking for more money than you have is an
        ordinary request that can simply be answered no.

  - id: array-list
    title: Array and `ArrayList`
    module: module-1
    lecture: 01-objects-and-state/many-objects.md
    source: L4.1 Many objects
    a:
      term: Array
      text: Fixed length, chosen when it is created. Read it with `length`.
      code: |
        Account[] accounts = new Account[3];
    b:
      term: "`ArrayList`"
      text: Grows and shrinks. Read it with `size()`, change it with `add` and `remove`.
      code: |
        List<Account> accounts = new ArrayList<>();
    difference: >-
      Both hold references to objects. Use an array when the size is fixed and
      known in advance, and a list when items come and go.
    check:
      question: >-
        `accounts` was created with `new Account[3]`, and all three places are
        used. What happens on `accounts[3] = new Account("Grace Hopper", 1500.00);`?
      answer: >-
        An `ArrayIndexOutOfBoundsException`. The array cannot grow; its valid
        positions are 0, 1 and 2.

  - id: null-empty
    title: "`null` and empty"
    module: module-1
    lecture: 01-objects-and-state/many-objects.md
    source: L4.1 Many objects
    a:
      term: "`null`"
      text: No object at all. Any method call on it throws a `NullPointerException`.
      code: |
        List<Account> accounts = null;
    b:
      term: Empty
      text: A real object with nothing in it. Its methods work and report zero.
      code: |
        List<Account> accounts = new ArrayList<>();
    difference: >-
      Return an empty list rather than `null`, so the caller's loop simply
      runs zero times. For text the same holds: `""` is an empty `String`, and
      `null` is no `String`.
    check:
      question: >-
        What does `accounts.isEmpty()` give when `accounts` is `null`?
      answer: >-
        Neither `true` nor `false`: it throws a `NullPointerException`, because
        there is no list to ask.

  - id: overload-override
    title: Overriding and overloading
    module: module-2
    lecture: 02-designing-with-objects/telling-apart.md
    source: L5.2 Object Equality
    a:
      term: Overriding
      text: Same name and same parameter types as an inherited method. Your version replaces it.
      code: |
        @Override
        public boolean equals(Object other)
    b:
      term: Overloading
      text: Same name, different parameter types. A second, separate method.
      code: |
        public boolean equals(Account other)
    difference: >-
      `List.contains` calls `equals(Object)`. It never calls an
      `equals(Account)` overload, so the list keeps comparing identity.
      Writing `@Override` turns that mistake into a compile error.
    check:
      question: >-
        A class has `@Override` above `public boolean equals(Account other)`
        and no other `equals`. What happens?
      answer: >-
        It does not compile. The method overrides nothing, because
        `Object.equals` takes an `Object`.

  - id: switch-statement-expression
    title: Switch statement and switch expression
    module: module-2
    lecture: 02-designing-with-objects/enums.md
    source: L6.2 Enumerations
    a:
      term: Switch statement
      text: Runs code in each branch. It need not cover every case.
      code: |
        switch (choice) {
            case "1" -> listCustomers();
            default -> System.out.println("No such option.");
        }
    b:
      term: Switch expression
      text: Produces a value. Over an enum it must cover every constant.
      code: |
        boolean allowed = switch (type) {
            case CHECKING -> balance - amount >= 0.00;
            case SAVINGS -> balance - amount >= 100.00;
            case TERM_DEPOSIT -> false;
        };
    difference: >-
      Use an expression when you are choosing a value. Adding a constant to
      the enum then turns every forgotten switch into a compile error instead
      of a silent `default`.
    check:
      question: >-
        A switch expression over `AccountType` covers `CHECKING` and
        `SAVINGS` only. What happens?
      answer: >-
        It does not compile: the switch expression does not cover all
        possible input values.
