<svg viewBox="0 0 520 230" role="img" xmlns="http://www.w3.org/2000/svg"><title>A static field shared by every object</title><desc>At the top, the Account class holds one static field, lastNumberIssued, with the value 1003. Below it, three Account objects each hold their own number and balance: AC-1001 with 500.00, AC-1002 with 2500.00 and AC-1003 with 1500.00. Dashed lines connect each object to the single shared field in the class.</desc><rect x="150" y="20" width="220" height="60" rx="8" fill="var(--c-raised)" stroke="var(--c-accent)" stroke-width="2"/><text x="166" y="44" font-family="Source Serif 4, Georgia, serif" font-size="14" font-weight="700" fill="var(--c-ink)">Account, the class</text><text x="166" y="66" font-family="JetBrains Mono, monospace" font-size="11" fill="var(--c-accent)">static lastNumberIssued 1003</text><g stroke="var(--c-accent)" stroke-width="1.5" stroke-dasharray="4 4" fill="none" opacity="0.8"><line x1="90" y1="128" x2="210" y2="82"/><line x1="260" y1="128" x2="260" y2="82"/><line x1="430" y1="128" x2="310" y2="82"/></g><g fill="var(--c-surface)" stroke="var(--c-border)" stroke-width="2"><rect x="20" y="130" width="140" height="62" rx="8"/><rect x="190" y="130" width="140" height="62" rx="8"/><rect x="360" y="130" width="140" height="62" rx="8"/></g><g font-family="JetBrains Mono, monospace" font-size="12" fill="var(--c-ink)"><text x="34" y="156">AC-1001</text><text x="204" y="156">AC-1002</text><text x="374" y="156">AC-1003</text></g><g font-family="JetBrains Mono, monospace" font-size="11" fill="var(--c-muted)"><text x="34" y="178">balance  500.00</text><text x="204" y="178">balance 2500.00</text><text x="374" y="178">balance 1500.00</text></g><g font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-muted)"><text x="20" y="40">one copy,</text><text x="20" y="54">in the class</text><text x="20" y="218">one balance per object, an instance field</text></g></svg>
