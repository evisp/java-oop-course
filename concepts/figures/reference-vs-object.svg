<svg viewBox="0 0 520 180" role="img" xmlns="http://www.w3.org/2000/svg"><title>Two references, one object</title><desc>Two variables, ada and backup, each hold an arrow. Both arrows point at the same Account object, which holds the number AC-1001 and a balance of 300.00 EUR. There is one account and two references to it.</desc><g font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="var(--c-muted)"><text x="20" y="20">References</text><text x="300" y="20">Object</text></g><g fill="var(--c-surface)" stroke="var(--c-border)" stroke-width="2"><rect x="20" y="40" width="110" height="38" rx="6"/><rect x="20" y="112" width="110" height="38" rx="6"/></g><g font-family="JetBrains Mono, monospace" font-size="13" fill="var(--c-ink)"><text x="34" y="64">ada</text><text x="34" y="136">backup</text></g><g fill="var(--c-accent)"><circle cx="114" cy="59" r="4"/><circle cx="114" cy="131" r="4"/></g><g stroke="var(--c-accent)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M114 59 C 190 59 220 84 294 88"/><polyline points="284,82 294,88 284,94"/><path d="M114 131 C 190 131 220 106 294 102"/><polyline points="284,96 294,102 284,108"/></g><rect x="300" y="40" width="200" height="110" rx="8" fill="var(--c-raised)" stroke="var(--c-accent)" stroke-width="2"/><text x="316" y="66" font-family="Source Serif 4, Georgia, serif" font-size="15" font-weight="700" fill="var(--c-ink)">Account</text><line x1="316" y1="76" x2="484" y2="76" stroke="var(--c-border)" stroke-width="1.5"/><g font-family="JetBrains Mono, monospace" font-size="12" fill="var(--c-ink)"><text x="316" y="100">AC-1001</text><text x="316" y="122">300.00 EUR</text></g><g font-family="JetBrains Mono, monospace" font-size="10" fill="var(--c-muted)"><text x="20" y="172">Account backup = ada;  copies the arrow</text><text x="300" y="172">still one account</text></g></svg>
