site_name: Java OOP Course
site_url: https://evisp.github.io/java-oop-course/
site_author: evisp
site_description: Learn Java object-oriented programming by building. Course materials for University Metropolitan Tirana.
repo_name: evisp/java-oop-course
repo_url: https://github.com/evisp/java-oop-course
copyright: Copyright &copy; 2026 Evis Plaku - Course Materials

# ===========================================================================
# THE VAULT
# ---------------------------------------------------------------------------
# draft_docs   : built by `mkdocs serve`, never by `mkdocs build`.
#                You can preview these locally. Students cannot reach them.
# exclude_docs : not built by anything. For solutions and answer keys.
# TO RELEASE A MODULE, three edits, no automation:
#   1. delete its line from draft_docs below
#   2. uncomment its block in nav
#   3. flip its card from locked to live in docs/roadmap.md
# If you do 1 without 2, the pages build but are unreachable except by URL.
# If you do 2 without 1, the build warns about nav entries it cannot find.
#
# Seminars are released one week at a time, so they are listed individually
# rather than by folder. A module folder in draft_docs covers everything in
# it, including seminars that are not listed separately.
# ===========================================================================
draft_docs: |
  01-objects-and-state/seminar-3.md
  01-objects-and-state/seminar-4.md
  02-designing-with-objects/
  03-robust-and-modern-java/
  04-building-an-application/
  projects/

exclude_docs: |
  **/solutions/
  **/*.answers.md

theme:
  name: material
  language: en
  # Fonts are loaded once, from docs/stylesheets/custom.css, so that all
  # typography lives in one file. Material's own loader only has two slots
  # and this course uses three families.
  font: false
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.path        # breadcrumbs, needs mkdocs-material >= 9.7.0
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
  icon:
    repo: fontawesome/brands/github
  # navigation.expand was removed. With 14 weeks of material it produces a
  # permanently open sidebar that gets unusable as modules are released.

extra_css:
  - stylesheets/custom.css

plugins:
  - search
  # minify was removed. It collapses whitespace inside inline SVG, and the
  # diagrams on this site are inline SVG.

validation:
  nav:
    omitted_files: info
    not_found: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

nav:
  - Home: index.md
  - Roadmap: roadmap.md
  - Tools:
      - Set up: 00-tools/index.md
      - Install Java: 00-tools/java.md
      - Install Eclipse: 00-tools/eclipse-setup.md
      - Git and GitHub: 00-tools/git-github.md
      # Released when the course reaches them. Add the matching line to
      # draft_docs above at the same time as you uncomment these.
      # - Maven: 00-tools/maven.md
      # - JavaFX and Scene Builder: 00-tools/javafx.md

  - Objects and State:
      - Overview: 01-objects-and-state/index.md
      - Reference, the university system: 01-objects-and-state/university-system.md
      - L1.1 Thinking in things: 01-objects-and-state/thinking-in-things.md
      - L1.2 Why objects: 01-objects-and-state/why-objects.md
      - S1 Setting up and designing: 01-objects-and-state/seminar-1.md
      - L2.1 Your first class: 01-objects-and-state/first-class.md
      - L2.2 What a variable really holds: 01-objects-and-state/references.md
      - S2 Your first classes: 01-objects-and-state/seminar-2.md
      - L3.1 Objects that refuse: 01-objects-and-state/objects-that-refuse.md
      - L3.2 What belongs to whom: 01-objects-and-state/what-belongs-to-whom.md
      - S3 Making them refuse: 01-objects-and-state/seminar-3.md
      - L4.1 Many objects: 01-objects-and-state/many-objects.md
      - L4.2 Objects that own other objects: 01-objects-and-state/owning-objects.md
      - S4 Connecting the system: 01-objects-and-state/seminar-4.md

  # =========================================================================
  # VAULTED. Uncomment a block together with its draft_docs line above.
  # =========================================================================

