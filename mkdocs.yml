  #     - L11.1 Writing it down: 03-robust-and-modern-java/writing-files.md
  #     - L11.2 Reading it back: 03-robust-and-modern-java/reading-files.md
  #     - S11 Surviving a restart: 03-robust-and-modern-java/seminar-11.md
  #     - L12.1 Data that does not change: 03-robust-and-modern-java/records.md
  #     - L12.2 Describing the result: 03-robust-and-modern-java/streams.md
  #     - S12 The short version: 03-robust-and-modern-java/seminar-12.md

  # --- Module 4, weeks 13 to 14 --------------------------------------------
  # - Building an Application:
  #     - Overview: 04-building-an-application/index.md
  #     - L13.1 Your first window: 04-building-an-application/first-window.md
  #     - L13.2 Making it respond: 04-building-an-application/events.md
  #     - S13 A window on your system: 04-building-an-application/seminar-13.md
  #     - L14.1 Keeping the model out of the window: 04-building-an-application/model-and-ui.md
  #     - L14.2 Handing it to someone else: 04-building-an-application/shipping.md
  #     - S14 Finishing it: 04-building-an-application/seminar-14.md

  # --- Sprints. Released one at a time, not as a module. -------------------
  # - Projects:
  #     - Overview: projects/index.md
  #     - Sprint 1, your first system: projects/sprint-1.md
  #     - Sprint 2, designed properly: projects/sprint-2.md
  #     - Sprint 3, finished: projects/sprint-3.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
      toc_depth: 3
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/evisp
  # The analytics block was removed. It set provider: google with no
  # property key, so it was never working. Tracking students through a
  # third party on a required course site also needs a consent layer under
  # Albania's data protection law. Add it back deliberately or not at all.
