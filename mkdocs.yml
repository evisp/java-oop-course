  #     - L5.2 Telling objects apart: 02-designing-with-objects/telling-apart.md
  #     - S5 Making them work together: 02-designing-with-objects/seminar-5.md
  #     - L6.1 One job per class: 02-designing-with-objects/one-job.md
  #     - L6.2 A fixed set of values: 02-designing-with-objects/enums.md
  #     - S6 Splitting what you built: 02-designing-with-objects/seminar-6.md
  #     - L7.1 Building on another class: 02-designing-with-objects/inheritance.md
  #     - L7.2 When inheritance hurts: 02-designing-with-objects/inheritance-hurts.md
  #     - S7 A family of things: 02-designing-with-objects/seminar-7.md
  #     - L8.1 Promises a class must keep: 02-designing-with-objects/abstract-classes.md
  #     - L8.2 Many classes, one call: 02-designing-with-objects/interfaces.md
  #     - S8 Many kinds, one loop: 02-designing-with-objects/seminar-8.md

  # --- Module 3, weeks 9 to 12 ---------------------------------------------
  # - Robust and Modern Java:
  #     - Overview: 03-robust-and-modern-java/index.md
  #     - L9.1 When things go wrong: 03-robust-and-modern-java/when-things-go-wrong.md
  #     - L9.2 Something better than null: 03-robust-and-modern-java/better-than-null.md
  #     - S9 Failing properly: 03-robust-and-modern-java/seminar-9.md
  #     - L10.1 Proving it works: 03-robust-and-modern-java/proving-it-works.md
