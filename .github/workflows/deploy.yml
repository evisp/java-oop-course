# ===========================================================================
# Do NOT run `mkdocs gh-deploy` from your laptop once this workflow is live.
# Both push to the gh-pages branch and they will overwrite each other.
# Local preview is `mkdocs serve`. Publishing is this file, on push to main.
# ===========================================================================
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      # --clean and --strict together. Strict turns the link warnings from
      # validation: into build failures, so a broken link fails CI instead of
      # shipping. `mkdocs build` (not serve) means draft_docs are excluded.
      - name: Build
        run: mkdocs build --clean --strict

      - name: Publish
        run: mkdocs gh-deploy --force --no-history